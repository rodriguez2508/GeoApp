<header
  id="header"
  [class]="
    ' w3-row w3-col l12 m12 s12 set-height-8 bg-dark border-bottom border-warning border-1 '
  "
>
  <nav [class]="'navbar navbar-expand-sm navbar-dark pt-sm-0 '">
    <div [class]="'w3-col l12 m12 s12 container-fluid '">
      <div [class]="'w3-col l3 m2 s12 '">
        <a [class]="'navbar-brand '" href="#">
          <!-- <img
            src="./assets/img/linki.ico"
            alt=""
            [class]="' img-logo-xmd rounded-3 p-1'"
          /> -->

          <label class="fw-bolder">{{ titleApp }}</label>
        </a>

        <button
          [class]="'navbar-toggler w3-right btn text-white border-0 animated__fadeIn ms-sm-2'"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#Navbar"
          (click)="toggleIcon()"
        >
          <i [class]="iconClass" [class.active]="'isActive fadeIn '"></i>
        </button>

        <button
          [class]="'navbar-toggler w3-right btn btn-dark text-white animated__fadeIn ms-sm-2'"
          type="button"
          (click)="toggleFullscreen()"
        >
          <i [class]="'fa fa-mobile-phone '"></i>
        </button>
      </div>
      <div [class]="'w3-row w3-col l9 m8 s12 '">
        <!-- -------- -->
        <!-- -------- -->
        <!-- -------- -->

        <div [class]="'w3-col collapse navbar-collapse '" id="Navbar">
 
          <ul [class]="'w3-col navbar-nav navba p-1 justify-content-end '">
            @if(!userLoginOn){

            <!-- -------- -->
            <!-- -------- NO LOGIN USER -->
            <!-- -------- -->
            <li [class]="'nav-item btn btn-md '">
              <a
                [class]="'nav-link fw-bold border-bottom border-secondary'"
                routerLink="/public/home"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                >Inicio</a
              >
            </li>
            <li [class]="'nav-item btn btn-md '">
              <a
                [class]="'nav-link fw-bold border-bottom border-secondary '"
                routerLink="/session/signin"
                
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                data-bs-toggle="tooltip"
                title="Mostrar opciones de sesión!"
                >Sesión</a
              >
            </li>

            <!-- -------- -->
            <!-- -------- NO LOGIN USER -->
            <!-- -------- -->
            } @else{

            <!-- -------- -->
            <!-- -------- LOGIN USER -->
            <!-- -------- -->
            <li [class]="'nav-item btn btn-md '">
              <a
                [class]="'nav-link fw-bold border-bottom border-secondary'"
                routerLink="/private/home"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                >Inicio</a
              >
            </li>
            <li [class]="'nav-item btn btn-md '">
              <a
                [class]="'nav-link fw-bold border-bottom border-secondary '"
                routerLink="/map/show"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                >Mapa</a
              >
            </li>

             
            <li [class]="'nav-item btn btn-sm w3-row '">
              <button
              [class]="'w3-col l6 m6 pe-4 btn text-white '"
              (click)="shareApp('')"
            >
              <i [class]="'fa fa-share-alt me-2 float-sm-start'"></i>
              <label [class]="'w3-small float-sm-start w3-hide-medium w3-hide-large'" for="">Compartir</label>
            </button>

              <button
                [class]="'w3-col l6 m6 pe-4 btn text-white'"
                (click)="f_signOut()"
              >
                <i [class]="'fa fa-sign-out-alt me-2 float-sm-start'"></i>
                <label [class]="'w3-small float-sm-start w3-hide-medium w3-hide-large'" for="">Cerrar Sesión</label>
              </button>

             
            </li> 

            <!-- -------- -->
            <!-- -------- LOGIN USER -->
            <!-- -------- -->
            }
          </ul>
        </div>
      </div>
    </div>
  </nav>
</header>
