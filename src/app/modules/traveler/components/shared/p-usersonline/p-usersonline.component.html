<div class="panel panel-default">
  <h4 class="panel-heading">Connected Users</h4>
  <ul class="list-group w3-ul">
    @for (item of connected_DriverUsers; track $index) {

    <li class="list-group-item ">
      <label>{{ item.user.user_name }} | LAT: {{ item.currentPosition.lat }} LON: {{ item.currentPosition.long }}</label>
    </li>

    }
  </ul>
</div>
