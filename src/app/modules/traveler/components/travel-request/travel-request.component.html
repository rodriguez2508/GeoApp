<section class="w3-row w3-col">
  @if(viewToShow == 'map' && (!location_status || !socket_status)){

  <div
    class="w3-row w3-col panel-error-connection position-absolute set-height-85 align-content-between"
    style="z-index: 2"
  >

  @if(!socket_status){
    <label
      class="w3-col w3-container border-top border-bottom border-dark text-white w3-xlarge bg-danger " style="height: 10px;"
    >
    </label>

    }
    @if( max_count < 3){

    <!-- <label
      class=" panel-error-connection w3-col w3-container border-top border-bottom border-dark text-white w3-xlarge _center-h"
    >
      obteniendo ubicación..
      <span
        class="btn btn-sm btn-primary spinner-border spinner-border-sm"
      ></span>
    </label> -->

    <label
      class="w3-col w3-container border-top border-bottom border-dark text-white w3-xlarge bg-warning " style="height: 10px;"
    >
    </label>

    } @else if(max_count >= 3) {

    <label
      class="w3-col w3-container border-top border-bottom border-dark text-white w3-xlarge _center-h"
    >
      error al buscar su ubicación
      <span
        class="btn btn-md border border-warning text-warning float-end pt-3"
        (click)="reload_location()"
        ><i class="w3-btn w3-btn-floating-large fa fa-arrow-left-rotate"></i
      ></span>
    </label>
    } 
  </div>

  }


  <!-- -------------- -->
  <!-- content page -->
  <!-- -------------- -->
  <div class="tab-content" id="myTabContent">
    <div
      class="tab-pane fade show active"
      id="map"
      role="tabpanel"
      aria-labelledby="map-tab"
    >
      <div class="w3-row w3-col set-height-s-85 border border-dark">
        <!-- -------------- -->
        <!-- Body page -->
        <!-- -------------- -->
        @if(viewToShow == 'map'){
        <app-map-page
          [lat]="lat"
          [lon]="lon"
          [zoom]="zoom"
          [width]="'100%'"
          [height]="'89vh'"
          [socket_status]="socket_status"
          [location_status]="location_status"
          [connected_users]="connected_users"
          [userData]="userData"
        ></app-map-page>
        } @else if(viewToShow == 'form'){
        <app-form-page></app-form-page>

        }
      </div>
    </div>
    <!--  -->
    <!--  -->
    <div
      class="tab-pane fade"
      id="offers"
      role="tabpanel"
      aria-labelledby="offers-tab"
    >
      <h3>Ofertas</h3>
    </div>
    <!--  -->
    <!--  -->
    <div
      class="tab-pane fade"
      id="history"
      role="tabpanel"
      aria-labelledby="history-tab"
    >
      <h3>Historial</h3>
    </div>
  </div>
</section>
