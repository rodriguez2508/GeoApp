<section class="w3-row w3-col">
    @if(!location_status && max_count < 5){
    <label class="w3-col w3-container border-bottom border-dark text-primary ">
      obteniendo ubicación..
      <span class="btn btn-sm btn-primary spinner-border spinner-border-sm"></span> 
      <span class="btn btn-sm border border-danger w3-small float-end" (click)="reload_location()"><i class="fa fa-arrow-left-rotate"></i></span>
    </label>
    } @else if(max_count >= 5) {
      <label class="w3-col w3-container border-bottom border-dark me-3 ">
        error al buscar su  ubicación
        <span class="btn btn-warning " (click)="reload_location()">Reintentar</span>
      </label>
    } @if(!socket_status){
    <label class="w3-col w3-container border-bottom border-dark text-success">
      conectando al servidor...
      <span class="btn btn-sm btn-primary spinner-border spinner-border-sm"></span>
    </label>
    }
  
  
    <!-- -------------- -->
    <!-- content page -->
    <!-- -------------- -->
    <div class="w3-row w3-col set-height-s-90 border border-dark">
       
      <!-- -------------- -->
      <!-- Body page -->
      <!-- -------------- -->
      <app-map-page
      [lat]="lat"
      [lon]="lon"
      [zoom]="zoom"
      [width]="'100%'"
      [height]="'90vh'"
      [socket_status]="socket_status"
      [location_status]="location_status"
      [connected_users]="connected_users"
      [userData]="userData"
      ></app-map-page>
   
    </div>
  </section>
