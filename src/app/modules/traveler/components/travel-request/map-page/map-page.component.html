<div class="w3-row w3-col">
  <div id="map" class="map">
    <!-- <div class="position-absolute popover text-white bg-dark" id="popup"></div> -->

    @if(location_status && socket_status && !footerDisplayed){

    <!-- ... -->
    <button
      id="btn_centerPosition"
      [class]="
        'btn position-absolute bg-dark w3-round-xxlarge text-white border border-secondary'
      "
      type="button"
      (click)="centerMap()"
    >
      <i [class]="'fa fa-location-crosshairs w3-xlarge p-1'"></i>
    </button>
    <!-- ... -->

    <!-- ... -->
    <button
      id="btn_navigation"
      (click)="reloadWithParams()"
      type="button"
      class="btn btn-md position-absolute bg-dark text-warning border border-warning"
    >
      <i class="fa fa-route w3-xlarge"></i>
    </button>

    <!-- ... -->

    <!-- ... -->
    <button
      id="btn_markers"
       
      type="button"
      class="btn btn-md position-absolute bg-dark text-warning border border-warning"
    >
      <i class="fa fa-folder w3-xlarge"></i>
    </button>

    <!-- ... -->

    @if(socket_status){
    <button
      class="btn btn-md position-absolute bg-dark text-white border border-secondary"
      id="btn_show_drivers"
    >
      <i class="fa fa-car-on w3-xlarge"></i>
      @switch (connected_DriverUsers.length) { @case (0) {
      <span
        class="w3-badge position- text-white fw-bold border border-danger bg-transparent"
        style="bottom: 27px !important"
        >{{ connected_DriverUsers.length }}</span
      >
      } @default {
      <span
        class="w3-badge position-absolute text-dark fw-bold border border-danger bg-danger"
        style="bottom: 27px !important"
        >{{ connected_DriverUsers.length }}</span
      >
      } }
    </button>

    } }

    <!-- ... -->
    <!-- <button
        id="btn_clearMarkers"
        [class]="'btn position-absolute bg-light border border-secondary'"
        type="button"
        (click)="clearMarker('destination')"
      >
        <i [class]="'fa fa-broom '"></i>
      </button> -->
    <!-- ... -->
  </div>

  <!-- Popup -->
  <div id="popup"></div>

  @if(footerDisplayed){

  <app-footer-page
    [connected_users]="connected_users"
    [methodToShowFooter]="methodToShowFooter"
    [address]="address"
    [distance]="distance"
    [coord]="coord"
    [coord_destination]="coord_destination"
  ></app-footer-page>

  }
</div>
